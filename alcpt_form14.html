<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALCPT Form 14</title>
<style>
  :root {
    --army-green: #4a5e3a;
    --army-dark: #2d3b22;
    --army-light: #8a9e6e;
    --army-tan: #c8b89a;
    --army-sand: #f0e8d0;
    --correct: #2e7d32;
    --wrong: #c62828;
    --neutral: #37474f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1f14; color: #e8e0cc; min-height: 100vh; }
  header { background: linear-gradient(135deg, var(--army-dark) 0%, var(--army-green) 100%); padding: 24px 32px; border-bottom: 3px solid var(--army-tan); }
  header h1 { font-size: 1.8rem; letter-spacing: 2px; color: var(--army-tan); }
  header p { color: var(--army-light); font-size: 0.9rem; margin-top: 4px; }
  .audio-bar { background: var(--army-dark); padding: 16px 32px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid var(--army-green); }
  .audio-bar audio { flex: 1; max-width: 500px; }
  .audio-label { color: var(--army-tan); font-size: 0.85rem; letter-spacing: 1px; }
  .progress-bar { background: var(--army-dark); padding: 12px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--army-green); }
  .progress-track { flex: 1; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--army-green), var(--army-light)); border-radius: 4px; transition: width 0.3s; }
  .progress-text { color: var(--army-light); font-size: 0.85rem; min-width: 80px; text-align: right; }
  .score-display { color: var(--army-tan); font-size: 0.85rem; min-width: 60px; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  .part-header { background: var(--army-dark); border-left: 4px solid var(--army-tan); padding: 12px 20px; margin: 28px 0 16px; border-radius: 0 8px 8px 0; }
  .part-header h2 { color: var(--army-tan); font-size: 1rem; letter-spacing: 2px; }
  .part-header p { color: var(--army-light); font-size: 0.82rem; margin-top: 4px; }
  .question-card { background: #242b1c; border: 1px solid #3a4a2a; border-radius: 10px; margin-bottom: 16px; overflow: hidden; transition: border-color 0.2s; }
  .question-card:hover { border-color: var(--army-light); }
  .question-card.answered-correct { border-color: var(--correct); }
  .question-card.answered-wrong { border-color: var(--wrong); }
  .q-header { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; }
  .q-num { background: var(--army-green); color: var(--army-tan); font-weight: bold; font-size: 0.8rem; padding: 3px 9px; border-radius: 4px; white-space: nowrap; margin-top: 2px; }
  .q-stem { color: #ddd; font-size: 0.95rem; line-height: 1.5; flex: 1; }
  .q-stem .blank { display: inline-block; min-width: 60px; border-bottom: 2px solid var(--army-light); text-align: center; }
  .options { padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 6px; }
  .option-btn { background: #1a201a; border: 1px solid #3a4a2a; border-radius: 6px; padding: 10px 16px; text-align: left; color: #ccc; font-size: 0.9rem; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
  .option-btn:hover:not(:disabled) { background: #2a3a2a; border-color: var(--army-light); color: #fff; }
  .option-btn:disabled { cursor: default; }
  .option-btn.selected-correct { background: #1b3b1b; border-color: var(--correct); color: #81c784; }
  .option-btn.selected-wrong { background: #3b1b1b; border-color: var(--wrong); color: #ef9a9a; }
  .option-btn.reveal-correct { background: #1b3b1b; border-color: var(--correct); color: #81c784; }
  .option-letter { font-weight: bold; font-size: 0.8rem; min-width: 18px; color: var(--army-light); }
  .explanation { display: none; background: #1a2510; border-top: 1px solid #3a4a2a; padding: 14px 20px; font-size: 0.85rem; line-height: 1.6; }
  .explanation.visible { display: block; }
  .expl-correct { color: #81c784; margin-bottom: 8px; }
  .expl-rule { color: var(--army-tan); background: #0d1a0d; border-left: 3px solid var(--army-green); padding: 8px 12px; border-radius: 0 4px 4px 0; margin-bottom: 8px; }
  .expl-distractors { color: #aaa; font-size: 0.82rem; }
  .expl-distractors ul { padding-left: 16px; margin-top: 4px; }
  .expl-distractors li { margin-bottom: 3px; }
  .transcript-box { display: none; background: #0d1a0d; border: 1px solid #2a3a2a; border-radius: 6px; padding: 10px 14px; margin: 0 20px 12px; font-size: 0.85rem; }
  .transcript-box.visible { display: block; }
  .transcript-en { color: #b0c4a0; margin-bottom: 4px; }
  .transcript-cz { color: #8a9e78; font-style: italic; }
  .show-transcript-btn { background: none; border: 1px solid #3a4a2a; color: var(--army-light); font-size: 0.75rem; padding: 3px 10px; border-radius: 4px; cursor: pointer; margin: 0 20px 10px; }
  .show-transcript-btn:hover { border-color: var(--army-light); color: #fff; }
  .results-panel { background: var(--army-dark); border: 2px solid var(--army-tan); border-radius: 12px; padding: 28px; margin: 32px 0; text-align: center; }
  .results-panel h2 { color: var(--army-tan); font-size: 1.4rem; margin-bottom: 16px; }
  .score-big { font-size: 3rem; font-weight: bold; color: var(--army-light); }
  .score-pct { font-size: 1.1rem; color: var(--army-tan); margin-top: 4px; }
  .stanag-result { margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #1a2510; color: var(--army-light); }
  .btn-restart { margin-top: 20px; background: var(--army-green); color: var(--army-tan); border: none; padding: 12px 28px; font-size: 1rem; border-radius: 6px; cursor: pointer; letter-spacing: 1px; }
  .btn-restart:hover { background: var(--army-dark); }
  .part-score { display: flex; justify-content: center; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
  .part-score-item { background: #1a2510; padding: 8px 16px; border-radius: 6px; text-align: center; }
  .part-score-item .label { font-size: 0.75rem; color: var(--army-light); }
  .part-score-item .val { font-size: 1.1rem; font-weight: bold; color: var(--army-tan); }
</style>
</head>

function buildTest() {
  const container = document.getElementById('testContainer');
  let html = '';
  let currentPart = null;
  const partInfo = {
    'I': { title: 'PART I — LISTENING', desc: 'Questions 1–25: You will hear questions on the test tape. Select the one correct answer a, b, c, or d.' },
    'II': { title: 'PART II — LISTENING', desc: 'Questions 26–50: You will now hear statements on the test tape. Select the one correct answer a, b, c, or d.' },
    'III': { title: 'PART III — LISTENING (DIALOGUES)', desc: 'Questions 51–60: You will now hear dialogues on the test tape. Select the one correct answer a, b, c, or d.' },
    'IV': { title: 'PART IV — READING', desc: 'Questions 61–100: Choose the one correct answer a, b, c, or d.' }
  };

  questions.forEach(q => {
    if (q.part !== currentPart) {
      currentPart = q.part;
      const pi = partInfo[currentPart];
      html += `<div class="part-header"><h2>${pi.title}</h2><p>${pi.desc}</p></div>`;
    }

    const isListening = q.type === 'listening';
    let stemHtml = '';
    if (q.type === 'reading') {
      stemHtml = q.stem.replace(/_{3,}/, '<span class="blank">_____</span>');
    }

    let optionsHtml = q.options.map((opt, i) => {
      const letter = ['a','b','c','d'][i];
      const displayOpt = q.type === 'reading' ? opt : `${letter}. ${opt}`;
      return `<button class="option-btn" data-qid="${q.id}" data-idx="${i}" onclick="answer(${q.id},${i})">`
        + `<span class="option-letter">${letter.toUpperCase()}.</span> ${displayOpt}</button>`;
    }).join('');

    let transcriptHtml = '';
    if (isListening) {
      transcriptHtml = `<button class="show-transcript-btn" onclick="toggleTranscript(${q.id})">Show transcript</button>
      <div class="transcript-box" id="trans-${q.id}">
        <div class="transcript-en">${q.transcript}</div>
        <div class="transcript-cz">${q.czTranscript}</div>
      </div>`;
    }

    let explHtml = '';
    if (q.type === 'listening') {
      let distHtml = '';
      if (q.distractors && q.distractors.length) {
        distHtml = '<div class="expl-distractors"><strong>Distraktory:</strong><ul>'
          + q.distractors.map(d => `<li><strong>${d.l}.</strong> ${d.t} — ${d.w}</li>`).join('')
          + '</ul></div>';
      }
      explHtml = `<div class="expl-correct">${q.expl}</div>${distHtml}`;
    } else {
      q.expl.forEach(e => {
        if (e.type === 'correct') explHtml += `<div class="expl-correct">${e.text}</div>`;
        else if (e.type === 'rule') explHtml += `<div class="expl-rule">📌 ${e.text}</div>`;
        else if (e.type === 'distractors') {
          explHtml += '<div class="expl-distractors"><strong>Distraktory:</strong><ul>'
            + e.items.map(it => `<li>${it}</li>`).join('') + '</ul></div>';
        }
      });
    }

    html += `<div class="question-card" id="qcard-${q.id}">
      <div class="q-header">
        <span class="q-num">Q${q.id}</span>
        <span class="q-stem">${stemHtml || '&nbsp;'}</span>
      </div>
      ${transcriptHtml}
      <div class="options">${optionsHtml}</div>
      <div class="explanation" id="expl-${q.id}">${explHtml}</div>
    </div>`;
  });

  html += `<div class="results-panel" id="resultsPanel" style="display:none">
    <h2>Test Complete</h2>
    <div class="score-big" id="finalScore">—</div>
    <div class="score-pct" id="finalPct">—</div>
    <div class="part-score" id="partScores"></div>
    <div class="stanag-result" id="stanagResult"></div>
    <button class="btn-restart" onclick="restartTest()">Restart Test</button>
  </div>`;

  container.innerHTML = html;
}

let answered = {};
let scores = { I:0, II:0, III:0, IV:0, total:0 };
let counts = { I:0, II:0, III:0, IV:0, total:0 };

function answer(qid, idx) {
  if (answered[qid]) return;
  const q = questions.find(x => x.id === qid);
  if (!q) return;
  answered[qid] = true;
  counts[q.part]++; counts.total++;

  const isCorrect = idx === q.correct;
  if (isCorrect) { scores[q.part]++; scores.total++; }

  const card = document.getElementById('qcard-' + qid);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  const btns = card.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('reveal-correct');
    if (i === idx && !isCorrect) btn.classList.add('selected-wrong');
    if (i === idx && isCorrect) btn.classList.add('selected-correct');
  });

  document.getElementById('expl-' + qid).classList.add('visible');
  updateProgress();

  if (counts.total === questions.length) showResults();
}

function toggleTranscript(qid) {
  const box = document.getElementById('trans-' + qid);
  box.classList.toggle('visible');
}

function updateProgress() {
  const pct = (counts.total / questions.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = counts.total + ' / ' + questions.length;
  document.getElementById('scoreDisplay').textContent = 'Score: ' + scores.total;
}

function showResults() {
  const panel = document.getElementById('resultsPanel');
  panel.style.display = 'block';
  document.getElementById('finalScore').textContent = scores.total + ' / ' + questions.length;
  const pct = (scores.total / questions.length * 100).toFixed(1);
  document.getElementById('finalPct').textContent = pct + '% correct';

  let stanag = '';
  if (pct >= 75) stanag = 'Estimated ALCPT: 75+ — STANAG Level 3 (B2) likely achievable';
  else if (pct >= 50) stanag = 'Estimated ALCPT: 50–74 — STANAG Level 2 (B1) range';
  else if (pct >= 30) stanag = 'Estimated ALCPT: 30–49 — STANAG Level 1 (A2) range';
  else stanag = 'Estimated ALCPT: below 30 — Continue studying foundations';
  document.getElementById('stanagResult').textContent = stanag;

  const partNames = { I:'Part I (Q1–25)', II:'Part II (Q26–50)', III:'Part III (Q51–60)', IV:'Part IV (Q61–100)' };
  const partMax = { I:25, II:25, III:10, IV:40 };
  let psHtml = '';
  ['I','II','III','IV'].forEach(p => {
    psHtml += `<div class="part-score-item"><div class="label">${partNames[p]}</div><div class="val">${scores[p]}/${partMax[p]}</div></div>`;
  });
  document.getElementById('partScores').innerHTML = psHtml;
  panel.scrollIntoView({ behavior: 'smooth' });
}

function restartTest() {
  answered = {};
  scores = { I:0, II:0, III:0, IV:0, total:0 };
  counts = { I:0, II:0, III:0, IV:0, total:0 };
  buildTest();
  document.getElementById('resultsPanel') && (document.getElementById('resultsPanel').style.display = 'none');
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildTest();
updateProgress();
</script>
