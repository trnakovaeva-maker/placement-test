<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALCPT Form 43</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2744;
    --navy-mid: #1a3a5c;
    --blue: #2563a8;
    --accent: #e8a020;
    --accent-light: #fdf3dc;
    --green: #1a7a4a;
    --green-light: #e8f7ef;
    --red: #b91c1c;
    --red-light: #fef2f2;
    --gray-100: #f4f6f9;
    --gray-200: #e5e9f0;
    --gray-400: #94a3b8;
    --gray-600: #4a5568;
    --gray-800: #1e293b;
    --white: #ffffff;
    --radius: 8px;
    --shadow: 0 2px 12px rgba(15,39,68,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gray-100); color: var(--gray-800); }

  /* ── STICKY PLAYER ── */
  .player-bar {
    position: sticky; top: 0; z-index: 200;
    background: var(--navy);
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    padding: 12px 24px;
  }
  .player-inner {
    max-width: 800px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px;
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,0.7); text-decoration: none;
    font-size: 0.8rem; font-weight: 500; white-space: nowrap;
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .back-btn svg { width: 14px; height: 14px; fill: currentColor; }
  .player-title {
    font-family: 'DM Serif Display', serif;
    color: var(--white); font-size: 1rem; white-space: nowrap;
  }
  .player-title span { color: var(--accent); }
  .player-controls { display: flex; align-items: center; gap: 10px; flex: 1; }
  .btn-playpause {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--navy); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.15s, transform 0.1s;
  }
  .btn-playpause:hover { background: #d4911a; transform: scale(1.05); }
  .btn-playpause svg { width: 18px; height: 18px; fill: var(--navy); }
  .progress-track {
    flex: 1; height: 4px; background: rgba(255,255,255,0.15);
    border-radius: 2px; position: relative; cursor: default;
  }
  .progress-played {
    height: 100%; background: var(--accent); border-radius: 2px;
    width: 0%; transition: width 0.5s linear; pointer-events: none;
  }
  .player-time {
    font-size: 0.75rem; color: rgba(255,255,255,0.5);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  /* ── MAIN ── */
  .main { max-width: 800px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ── PART HEADER ── */
  .part-header {
    margin: 32px 0 14px; padding: 10px 16px;
    background: var(--navy-mid); border-radius: var(--radius);
  }
  .part-header h2 {
    font-family: 'DM Serif Display', serif;
    color: var(--white); font-size: 1rem; letter-spacing: 0.03em;
  }
  .part-header p { color: var(--gray-400); font-size: 0.8rem; margin-top: 3px; }

  /* ── QUESTION ROW ── */
  .q-row {
    background: var(--white); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 14px;
    border-left: 4px solid transparent; overflow: hidden;
    transition: border-color 0.2s;
  }
  .q-row.answered-correct { border-left-color: var(--green); }
  .q-row.answered-wrong   { border-left-color: var(--red); }

  .q-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px 18px 10px;
  }
  .q-num {
    background: var(--navy); color: var(--accent);
    font-size: 0.7rem; font-weight: 700; padding: 3px 8px;
    border-radius: 4px; white-space: nowrap; margin-top: 2px; flex-shrink: 0;
  }
  .opt-cz { display: block; font-size: 0.78rem; color: var(--gray-400); margin-top: 2px; }
  .expl-transcript { background: var(--gray-200); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .expl-tr-en { font-size: 0.85rem; color: var(--gray-800); font-style: italic; margin-bottom: 4px; }
  .expl-tr-cz { font-size: 0.82rem; color: var(--gray-600); }
  .q-stem { font-size: 0.9rem; color: var(--gray-800); line-height: 1.5; flex: 1; }

  /* ── TRANSCRIPT ── */
  .transcript-toggle {
    margin: 0 18px 10px;
    background: none; border: 1px solid var(--gray-200);
    color: var(--blue); font-size: 0.75rem; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-family: inherit;
    transition: background 0.1s;
  }
  .transcript-toggle:hover { background: var(--gray-100); }
  .transcript-box {
    display: none; margin: 0 18px 12px;
    background: var(--gray-100); border-radius: 6px;
    padding: 10px 14px; font-size: 0.82rem; line-height: 1.6;
  }
  .transcript-box.open { display: block; }
  .tr-en { color: var(--gray-800); }
  .tr-cz { color: var(--blue); font-style: italic; margin-top: 3px; }

  /* ── OPTIONS ── */
  .q-options { display: flex; flex-direction: column; gap: 7px; padding: 4px 18px 16px; }
  .q-option {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1.5px solid var(--gray-200); border-radius: 6px;
    padding: 9px 13px; cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    background: var(--white);
  }
  .q-option:hover:not(.locked) { border-color: var(--blue); background: #f0f5ff; }
  .q-option.locked { cursor: default; }
  .opt-letter {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--gray-200); color: var(--gray-600);
    font-size: 0.72rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px; transition: background 0.12s, color 0.12s;
  }
  .opt-text { font-size: 0.88rem; color: var(--gray-800); line-height: 1.4; }

  /* correct / wrong states */
  .q-option.opt-correct {
    border-color: var(--green); background: var(--green-light);
  }
  .q-option.opt-correct .opt-letter { background: var(--green); color: var(--white); }
  .q-option.opt-correct .opt-text { color: var(--green); font-weight: 500; }

  .q-option.opt-wrong {
    border-color: var(--red); background: var(--red-light);
  }
  .q-option.opt-wrong .opt-letter { background: var(--red); color: var(--white); }
  .q-option.opt-wrong .opt-text { color: var(--red); }

  /* ── EXPLANATION ── */
  .q-explanation {
    display: none; margin: 0 18px 16px;
    background: var(--accent-light); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; padding: 10px 14px; font-size: 0.82rem; line-height: 1.6;
  }
  .q-explanation.open { display: block; }
  .expl-correct { color: var(--green); font-weight: 600; margin-bottom: 5px; }
    .expl-correct-label { color: var(--green); font-weight: 600; margin-bottom: 4px; }
    .expl-text { color: var(--gray-700); margin-bottom: 5px; }
  .expl-rule { color: var(--navy-mid); margin-bottom: 5px; }
  .expl-dist { color: var(--red); font-size: 0.79rem; margin-top: 2px; }

  /* ── PROGRESS BAR ── */
  .answered-bar {
    position: sticky; top: 64px; z-index: 100;
    background: var(--white); border-bottom: 1px solid var(--gray-200);
    padding: 8px 24px; display: flex; align-items: center; gap: 14px;
  }
  .ans-track { flex: 1; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .ans-fill { height: 100%; background: var(--blue); border-radius: 3px; width: 0%; transition: width 0.2s; }
  .ans-text { font-size: 0.78rem; color: var(--gray-600); white-space: nowrap; min-width: 90px; text-align: right; }
  .score-text { font-size: 0.78rem; color: var(--green); font-weight: 600; white-space: nowrap; }

  /* ── SCORE BANNER ── */
  .score-banner {
    display: none; background: var(--navy); border-radius: var(--radius);
    padding: 28px; margin: 32px 0 16px; text-align: center;
  }
  .score-banner.open { display: block; }
  .score-big { font-family: 'DM Serif Display', serif; font-size: 3rem; color: var(--white); }
  .score-big span { font-size: 1.4rem; color: rgba(255,255,255,0.4); }
  .score-sub { font-size: 0.9rem; color: rgba(255,255,255,0.6); margin-top: 6px; }
  .score-parts { display: flex; justify-content: center; gap: 20px; margin-top: 18px; flex-wrap: wrap; }
  .score-part { background: rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 6px; }
  .score-part .val { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--white); }
  .score-part .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); }
  .stanag-result { margin-top: 14px; color: var(--accent); font-size: 0.88rem; }
  .btn-restart {
    margin-top: 20px; background: var(--accent); color: var(--navy);
    border: none; padding: 11px 28px; font-size: 0.9rem; font-weight: 600;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    transition: background 0.15s;
  }
  .btn-restart:hover { background: #d4911a; }
</style>
</head>

  let html = '';

      ? q.stem.replace(/_{3,}/, blankSpan)
      : '&nbsp;';
    const hasStem = !!q.stem;

      const letter = 'ABCD'[i];
      let display;
      if (q.type === 'reading') {
        display = opt.replace(/^[a-d]\. */, '');

        display = hasStem ? opt.charAt(0).toLowerCase() + opt.slice(1) : opt;
      }



      return `<div class="q-option" id="opt_${q.id}_${i}" onclick="answer(${q.id},${i})">

        <span class="opt-text">${display}</span>

    }).join('');

      <button class="transcript-toggle" onclick="toggleTranscript(${q.id})">Show transcript</button>
      <div class="transcript-box" id="trans_${q.id}">
        <div class="tr-en">${q.transcript}</div>
        <div class="tr-cz">${q.czTranscript}</div>
      </div>` : '';

    // Build explanation
    let explInner = '';
    if (q.type === 'listening') {
      explInner += `<div class="expl-transcript"><div class="expl-tr-en">${q.transcript}</div><div class="expl-tr-cz">${q.czTranscript}</div></div>`;
      if (q.czOptions) {
        const letters = ['A','B','C','D'];
        q.czOptions.forEach((cz, i) => {
          const cls = i === (typeof q.correct === 'string' ? parseInt(q.correct) : q.correct) ? 'expl-correct' : 'expl-dist';
          explInner += `<div class="${cls}"><strong>${letters[i]}.</strong> ${cz}</div>`;
        });
      }
    } else {
      q.expl.forEach(e => {
        if (e.type === 'correct') {
          const m = e.text.match(/^(Správná odpověď je [a-d]\. [^.]+\.)/i);
          if (m) {
            explInner += `<div class="expl-correct-label">${m[1]}</div><div class="expl-text">${e.text.slice(m[1].length).trim()}</div>`;
          } else {
            explInner += `<div class="expl-correct-label">${e.text}</div>`;
          }
        }
        else if (e.type === 'rule') explInner += `<div class="expl-rule">📌 ${e.text}</div>`;
        else if (e.type === 'distractors') {
          e.items.forEach(it => explInner += `<div class="expl-dist">• ${it}</div>`);
        }
      });
    }

    html += `<div class="q-row" id="qrow_${q.id}">
      <div class="q-head">
        <span class="q-num">Q${q.id}</span>
        <span class="q-stem">${stemHtml}</span>
      </div>
      ${transcriptBlock}
      <div class="q-options">${opts}</div>
      <div class="q-explanation" id="expl_${q.id}">${explInner}</div>
    </div>`;
  });

  html += `<div class="score-banner" id="scoreBanner">
    <div class="score-big" id="scoreBig"></div>
    <div class="score-sub" id="scoreSub"></div>
    <div class="score-parts" id="scoreParts"></div>
    <div class="stanag-result" id="stanagResult"></div>
    <button class="btn-restart" onclick="restartTest()">Restart Test</button>
  </div>`;

  container.innerHTML = html;
}

function answer(qid, idx) {
  if (answered[qid] !== undefined) return;
  const q = questions.find(x => x.id === qid);
  if (!q) return;
  const isCorrect = idx === (typeof q.correct === 'string' ? parseInt(q.correct) : q.correct);
  answered[qid] = idx;
  counts[q.part]++; counts.total++;
  if (isCorrect) { scores[q.part]++; scores.total++; }

  const row = document.getElementById('qrow_' + qid);
  row.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // Lock all options, style correct/wrong
  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt_${qid}_${i}`);
    el.classList.add('locked');
    if (i === (typeof q.correct === 'string' ? parseInt(q.correct) : q.correct)) el.classList.add('opt-correct');
    else if (i === idx && !isCorrect) el.classList.add('opt-wrong');
  });

  // Show explanation
  document.getElementById('expl_' + qid).classList.add('open');
  updateProgress();
  if (counts.total === questions.length) showResults();
}

function toggleTranscript(qid) {
  document.getElementById('trans_' + qid).classList.toggle('open');
}

function updateProgress() {
  const pct = (counts.total / questions.length * 100).toFixed(0);
  document.getElementById('ansFill').style.width = pct + '%';
  document.getElementById('ansText').textContent = counts.total + ' / ' + questions.length;
  document.getElementById('scoreText').textContent = scores.total + ' ✓';
}

function showResults() {
  const banner = document.getElementById('scoreBanner');
  banner.classList.add('open');
  document.getElementById('scoreBig').innerHTML = scores.total + '<span> / 100</span>';
  const pct = (scores.total / 100 * 100).toFixed(1);
  document.getElementById('scoreSub').textContent = pct + '% correct';

  const partNames = {I:'Part I (Q1–25)',II:'Part II (Q26–50)',III:'Part III (Q51–60)',IV:'Part IV (Q61–100)'};
  const partMax  = {I:25,II:25,III:10,IV:40};
  document.getElementById('scoreParts').innerHTML = ['I','II','III','IV'].map(p =>
    `<div class="score-part"><div class="val">${scores[p]}/${partMax[p]}</div><div class="lbl">${partNames[p]}</div></div>`
  ).join('');

  let stanag = '';
  if (scores.total >= 75) stanag = 'Estimated ALCPT 75+ · STANAG Level 3 (B2) range';
  else if (scores.total >= 50) stanag = 'Estimated ALCPT 50–74 · STANAG Level 2 (B1) range';
  else if (scores.total >= 30) stanag = 'Estimated ALCPT 30–49 · STANAG Level 1 (A2) range';
  else stanag = 'Below 30 · Continue working on foundations';
  document.getElementById('stanagResult').textContent = stanag;
  banner.scrollIntoView({ behavior: 'smooth' });
}

function restartTest() {
  answered = {}; scores = {I:0,II:0,III:0,IV:0,total:0}; counts = {I:0,II:0,III:0,IV:0,total:0};
  buildTest(); updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── AUDIO ──
const audio = document.getElementById('mainAudio');
function togglePlay() {
  if (audio.paused) { audio.play(); } else { audio.pause(); }
}
audio.addEventListener('play', () => {
  document.getElementById('iconPlay').style.display = 'none';
  document.getElementById('iconPause').style.display = '';
});
audio.addEventListener('pause', () => {
  document.getElementById('iconPlay').style.display = '';
  document.getElementById('iconPause').style.display = 'none';
});
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  document.getElementById('progPlayed').style.width = (audio.currentTime / audio.duration * 100) + '%';
  document.getElementById('playerTime').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
});
function fmt(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

buildTest();
updateProgress();
</script>
</body>
</html>
